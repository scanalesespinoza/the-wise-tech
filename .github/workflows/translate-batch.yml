name: translate-batch
on:
  workflow_dispatch:
    inputs:
      batch-id:
        description: "ID del batch (p.ej., w1-b1)"
        required: true
jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      GT_MAX_CHARS_PER_BATCH: "80000"
      GT_MAX_QPS: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip pyyaml
      - name: Translate batch
        run: |
          python scripts/translate-batch.py "${{ github.event.inputs.batch-id }}"
      - name: Git diff
        run: |
          git status && git diff --stat || true
