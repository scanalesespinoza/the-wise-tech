name: Bilingual Parity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate documentation parity
        run: |
          python scripts/check_bilingual_parity.py --check-scenarios
