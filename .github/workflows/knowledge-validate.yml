name: Knowledge Validate

on:
  pull_request:
    paths:
      - 'knowledge/docs/knowledge/**'
      - 'operations/scripts/validate-knowledge.py'
      - '.github/workflows/knowledge-validate.yml'
      - 'knowledge/docs/personas/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r operations/requirements-dev.txt || true
      - name: Validate knowledge base
        run: python operations/scripts/validate-knowledge.py
