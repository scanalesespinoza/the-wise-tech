name: Check upstream template updates

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare with upstream
        id: compare
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM_URL: https://github.com/scanalesespinoza/the-wise-tech.git
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          DEFAULT_BRANCH=${DEFAULT_BRANCH:-main}
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --tags --prune
          git fetch origin "$DEFAULT_BRANCH"
          LOCAL_REF="refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git show-ref --verify --quiet "$LOCAL_REF"; then
            LOCAL_REF=$(git rev-parse HEAD)
          fi
          UPSTREAM_REF="upstream/main"
          LOCAL_HEAD=$(git rev-parse "$LOCAL_REF")
          UPSTREAM_HEAD=$(git rev-parse "$UPSTREAM_REF")
          if [ "$LOCAL_HEAD" = "$UPSTREAM_HEAD" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UPSTREAM_TAG=$(git describe --tags --abbrev=0 "$UPSTREAM_REF" 2>/dev/null || echo "none")
          LOCAL_TAG=$(git describe --tags --abbrev=0 "$LOCAL_REF" 2>/dev/null || echo "none")
          git diff --stat "$LOCAL_REF" "$UPSTREAM_REF" > upstream-diff.txt
          cat <<REPORT > issue-body.md
          ### Upstream template update detected

          - Local head: $LOCAL_HEAD
          - Upstream head: $UPSTREAM_HEAD
          - Latest local tag: $LOCAL_TAG
          - Latest upstream tag: $UPSTREAM_TAG

          **Diff summary**
          ```
          $(cat upstream-diff.txt)
          ```

          Review [UPSTREAM_CHANGES.md](https://github.com/${REPO_SLUG}/blob/${DEFAULT_BRANCH}/UPSTREAM_CHANGES.md) for the curated changelog before syncing.
          REPORT
          echo "needs_update=true" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update upstream issue
        if: steps.compare.outputs.needs_update == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('issue-body.md', 'utf8');
            const titleBase = 'Upstream template update available';
            const upstreamTag = process.env.UPSTREAM_TAG || 'new commits';
            const title = `${titleBase} (${upstreamTag})`;
            const { owner, repo } = context.repo;
            const listParams = { owner, repo, state: 'open', per_page: 100 };
            const { data: openIssues } = await github.rest.issues.listForRepo(listParams);
            const existing = openIssues.find((issue) => issue.title.startsWith(titleBase));
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
        env:
          UPSTREAM_TAG: ${{ steps.compare.outputs.upstream_tag }}
