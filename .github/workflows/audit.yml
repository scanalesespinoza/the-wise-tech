---
name: audit
# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - experience/audit/**
      - knowledge/docs/**
      - operations/mkdocs.yml
      - README.md
      - operations/Makefile
      - operations/scripts/**
      - .github/workflows/**

jobs:
  audit:
    permissions:
      contents: read
      issues: write
    environment: "on"
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_API_URL: ${{ vars.LLM_API_URL }}
      LLM_MODEL: DeepSeek-R1-Distill-Qwen-14B-W4A16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip pyyaml
      - name: Run audit
        run: |
          python operations/scripts/audit-evaluator.py
