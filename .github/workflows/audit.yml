name: audit
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - "audit/**"
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  audit:
    environment: on
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_API_URL: ${{ vars.LLM_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip pyyaml
      - name: Run audit
        run: |
          python scripts/audit-evaluator.py
