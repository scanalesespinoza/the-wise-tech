name: quality
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: CI (local equivalence)
        run: |
          make -f operations/Makefile ci
          make -f operations/Makefile resilience-check
          make -f operations/Makefile slos
          make -f operations/Makefile check-error-budget
