name: docs-and-links
on:
  pull_request:
    paths:
      - '**.md'
      - 'operations/mkdocs.yml'
      - 'knowledge/docs/**'
      - 'operations/scripts/check-links.py'
      - '.github/workflows/docs-and-links.yml'
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - 'operations/mkdocs.yml'
      - 'knowledge/docs/**'
      - 'operations/scripts/check-links.py'
jobs:
  docs_and_links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install mkdocs & tools
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocs-static-i18n pyyaml
      - name: Build docs
        run: mkdocs build --strict -f operations/mkdocs.yml
      - name: Check links
        run: python operations/scripts/check-links.py
      - name: Validate content metadata (front-matter + See also)
        run: python operations/scripts/validate-content-metadata.py
      - name: Check bilingual parity
        run: make -f operations/Makefile parity
      - name: Translation status (summary)
        run: make -f operations/Makefile translate-status-check
