name: translation-qa
on:
  pull_request:
    branches: [ main ]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "audit/translation-queue.yml"
      - "scripts/translate-batch.py"
  push:
    branches: [ main ]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocs-static-i18n mkdocs-minify-plugin \
            mkdocs-git-revision-date-localized-plugin pyyaml
      - name: Build strict
        run: mkdocs build --strict
      - name: Verify links
        run: |
          if [ -f scripts/check-links.py ]; then python scripts/check-links.py --strict; else echo "skip links"; fi
      - name: Validate content metadata
        run: |
          if [ -f scripts/validate-content-metadata.py ]; then python scripts/validate-content-metadata.py; else echo "skip meta"; fi
