version: "3.9"
services:
  otel-collector:
    image: otel/opentelemetry-collector:0.105.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 10s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.58
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI
      - "14250:14250" # gRPC
      - "14268:14268" # HTTP
    depends_on:
      - otel-collector

  # Docs en vivo (opcional: puedes correr mkdocs localmente sin contenedor)
  docs:
    image: python:3.11-slim
    working_dir: /work
    volumes:
      - ../..:/work
    command: bash -lc "python -m pip install -U pip mkdocs mkdocs-material mkdocs-i18n && mkdocs serve -a 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on: []
    # Puedes desactivar este servicio si prefieres `mkdocs serve` local.
