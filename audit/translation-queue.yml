    Traduce primero en inglés, luego crea o actualiza el archivo en knowledge/docs/es/ siguiendo la misma estructura.
    Usa `make -f operations/Makefile translate-batch BATCH=<id>` para procesar entradas pendientes.
  last_update: 2024-06-02
