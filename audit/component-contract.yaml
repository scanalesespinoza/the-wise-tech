# Plantilla alineada con specs/component-behavior-contract.schema.md
---
version: 1.1.0
component:
  name: component-example
  domain: catalog-sync
  description: Servicio que sincroniza catálogos con proveedores externos.
ownership:
  team: Equipo Catálogo Dinámico
  service_slack: "#cat-dynamic-support"
  escalation: "PagerDuty -> Manager -> Director de Ingeniería"
runtime:
  tier: tier-1
  language: python-3.11
  deployment: kubernetes
resilience:
  error_handling_strategy:
    expected_errors:
      - inventory-api timeout
      - proveedor responde payload inválido
    boundary_cases:
      - catálogos con >10k SKU simultáneos
    detection_channels:
      - structured-log:catalog-sync
      - metric:catalog_sync_retry_total
  cleanup_strategy:
    steps:
      - description: revertir transacciones parciales y liberar locks
        automation: true
      - description: notificar a proveedor para regenerar feed
        automation: false
  states_implemented:
    - in-service
    - degraded
    - out-of-service-controlled
  recovery:
    fallback_paths:
      - name: local-cache
        trigger: dependency timeout > 800ms
        impact: confirma pedidos con stock del último snapshot (riesgo bajo)
      - name: manual-review-queue
        trigger: payload inválido
        impact: analista valida en <30 min
    degraded_mode_playbook: https://runbooks.example.com/catalog-sync/degraded
performance:
  max_threads: 12
  max_requests_per_second: 150
  max_clients_per_minute: 90
  resource_budgets:
    cpu_percent: 60
    memory_percent: 65
  overflow_strategy: queue
  overflow_messaging:
    code: CAT-SYNC-429
    business_message: >-
      Estamos procesando alta demanda; tu catálogo se sincronizará en cuanto
      libremos capacidad.
observability:
  metrics_exposed:
    - name: catalog_sync_latency_p95
      type: histogram
      description: Latencia por lote en milisegundos.
    - name: catalog_sync_state
      type: gauge
      description: Modo operativo actual (1 in-service, 0 degradado).
  events_emitted:
    - name: catalog.sync.degraded
      when: state cambia a degraded
      payload_contract: state, reason, expected_recovery_min
    - name: catalog.sync.recovered
      when: vuelve a in-service
      payload_contract: state, recovered_at
  overload_signal:
    channel: metrics
    description: >-
      `catalog_sync_queue_depth` > 500 activa alerta y recomendación de escalar
      workers.
  degradation_signal:
    channel: event
    description: >-
      `catalog.sync.degraded` informa impacto, ETA y fallback activo.
zero_trust:
  input_validation:
    - interface: https api/catalog-sync
      rules: schema validation + firma HMAC del proveedor
  dependency_assumptions:
    - dependency: inventory-api
      verification: mutual TLS + timeouts a 800 ms
    - dependency: vendor-feeds
      verification: checksum + control de versionamiento
audit:
  last_review: 2024-05-10
  reviewers:
    - name: Reliability Guild
