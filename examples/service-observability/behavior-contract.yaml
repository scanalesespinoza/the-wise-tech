---
version: 1.1.0
component:
  name: service-observability
  domain: telemetry-labs
  description: >-
    Servicio de ejemplo que enfatiza señales de carga y aprendizaje.
ownership:
  team: observability-enablement
  service_slack: "#obs-labs"
  escalation: "https://pagerduty.example.com/schedules/OBS-LAB"
runtime:
  tier: tier-3
  language: python-3.12
  deployment: container
resilience:
  error_handling_strategy:
    expected_errors:
      - pipeline de métricas no disponible
      - cola de eventos saturada
    boundary_cases:
      - pérdida parcial de tags
      - reloj desincronizado
    detection_channels:
      - log:obs_lab.error
      - metric:obs_lab_exporter_failures
  cleanup_strategy:
    steps:
      - description: reenviar lotes en cola y limpiar buffers corruptos
        automation: true
      - description: solicitar re-sync de reloj NTP
        automation: false
  states_implemented:
    - in-service
    - degraded
    - out-of-service-controlled
  recovery:
    fallback_paths:
      - name: local-buffer-only
        trigger: pérdida de conectividad externa
        impact: eventos almacenados localmente 15 min
    degraded_mode_playbook: >-
      https://status.example.com/playbooks/obs-labs
performance:
  max_threads: 3
  max_requests_per_second: 60
  max_clients_per_minute: 30
  resource_budgets:
    cpu_percent: 45
    memory_percent: 50
  overflow_strategy: throttle
  overflow_messaging:
    code: OBS-LAB-429
    business_message: >-
      Reducimos el ritmo de ingestión para proteger la plataforma de
      observabilidad.
observability:
  metrics_exposed:
    - name: obs_lab_ingest_rps
      type: gauge
      description: RPS de ingesta por tipo de señal.
    - name: obs_lab_mode
      type: gauge
      description: >-
        Estado actual (1 servicio, 0 degradado, -1 fuera controlado).
  events_emitted:
    - name: obs.lab.overload
      when: ingest supera límite seguro
      payload_contract: rps_actual, limit, recommendation
    - name: obs.lab.degradation
      when: modo cambia a degradado
      payload_contract: reason, eta
  overload_signal:
    channel: event
    description: >-
      `obs.lab.overload` instruye a escalar workers o retrasar pruebas.
  degradation_signal:
    channel: metrics
    description: >-
      `obs_lab_mode` = 0 dispara mensaje a negocio.
zero_trust:
  input_validation:
    - interface: http ingest endpoint
      rules: api-key + schema + límites por tenant
  dependency_assumptions:
    - dependency: telemetry-bus
      verification: token firmado + compresión validada
audit:
  last_review: 2024-05-07
  reviewers:
    - name: Observability Guild
