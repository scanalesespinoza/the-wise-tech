rules:
  readme_has_start_here:
    weight: 8
    file: "README.md"
    must_contain:
      - "Start here"
  labs_exist:
    weight: 8
    path_exists:
      - "knowledge/docs/labs/lab-01-resilience-basics.md"
      - "knowledge/docs/labs/lab-02-observability-minima.md"
      - "knowledge/docs/labs/lab-03-adevelopment-loop.md"
  make_targets:
    weight: 6
    file: "Makefile"
    must_contain:
      - "lab-01"
      - "lab-02"
      - "lab-03"
      - "ci"
      - "verify-links"
  policies_exist:
    weight: 6
    path_exists:
      - "experience/scenarios/payments/policies/resilience.yml"
  slos_exist:
    weight: 6
    path_exists:
      - "experience/scenarios/payments/slo/slo-spec.yml"
  telemetry_smoke:
    weight: 5
    path_exists:
      - "operations/scripts/telemetry-smoke.py"
  mkdocs_configured:
    weight: 5
    file: "operations/mkdocs.yml"
    must_contain:
      - "site_url"
      - "nav:"
      - "Guides:"
      - "Labs:"
  links_checker:
    weight: 4
    path_exists:
      - "operations/scripts/check-links.py"
  editorial_checks:
    weight: 4
    path_exists:
      - "operations/scripts/validate-content-metadata.py"
  implementation_roadmap_present:
    weight: 6
    file: "implementation/roadmap.md"
    must_contain:
      - "## Current state"
      - "## Stages to reach a consumable product"
      - "## Immediate next steps"
  roadmap_docs_link_to_plan:
    weight: 4
    file: "knowledge/docs/roadmap/roadmap.md"
    must_contain:
      - "implementation/roadmap.md"
      - "release-XX"
  workflows_present:
    weight: 6
    path_exists:
      - ".github/workflows/quality.yml"
      - ".github/workflows/docs-and-links.yml"
thresholds:
  pass_score: 40
